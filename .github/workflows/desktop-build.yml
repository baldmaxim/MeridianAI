name: desktop-build

# Неподписанные установщики Meridian Desktop (Tauri 2): Windows x64 (.msi + NSIS .exe)
# и macOS Apple Silicon (.dmg). Сертификатов подписи нет: на macOS будет
# предупреждение Gatekeeper, на Windows SmartScreen.
# Запуск: gh workflow run desktop-build.yml   или   git tag desktop-v0.1.0 && git push origin desktop-v0.1.0
# На теге desktop-v* дополнительно создаётся черновик GitHub Release с установщиками.

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

defaults:
  run:
    working-directory: meridian-desktop

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-26 # Apple Silicon (M1 и новее)
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # До checkout папки meridian-desktop ещё нет.
        working-directory: ${{ github.workspace }}
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && matrix.target || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'meridian-desktop/src-tauri -> target'
          key: ${{ matrix.platform }}-${{ matrix.target }}-no-bin-v2
          cache-bin: false

      # Vulkan-бэкенд ggml на Windows x64 (transcribe-cpp-sys, feature `vulkan`).
      - name: Install Vulkan SDK (Windows x64)
        if: runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: install frontend dependencies
        run: bun install

      # VC++ runtime кладётся рядом с exe (app-local), чтобы приложение стартовало
      # без установленного Microsoft Redistributable. build.rs читает именно
      # переменную HANDY_VC_REDIST_DIRS (имя унаследовано от форка, менять нельзя).
      - name: Locate VC++ runtime redist for app-local bundling (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -property installationPath
          if (-not $vsRoot) { throw "vswhere found no Visual Studio installation" }
          $versionFile = Join-Path $vsRoot "VC\Auxiliary\Build\Microsoft.VCRedistVersion.default.txt"
          $redistVersion = (Get-Content $versionFile).Trim()
          $archDir = Join-Path $vsRoot "VC\Redist\MSVC\$redistVersion\x64"
          if (-not (Test-Path $archDir)) { throw "VC++ redist arch dir not found: $archDir" }
          $crt = Get-ChildItem $archDir -Directory -Filter "Microsoft.VC*.CRT" |
            Sort-Object Name | Select-Object -Last 1
          if (-not $crt -or -not (Test-Path (Join-Path $crt.FullName "msvcp140.dll"))) {
            throw "VC++ CRT redist dir not found or incomplete under: $archDir"
          }
          $omp = Get-ChildItem $archDir -Directory -Filter "Microsoft.VC*.OpenMP" |
            Sort-Object Name | Select-Object -Last 1
          if (-not $omp -or -not (Test-Path (Join-Path $omp.FullName "vcomp140.dll"))) {
            throw "VC++ OpenMP redist dir not found or incomplete under: $archDir"
          }
          $dirs = "$($crt.FullName);$($omp.FullName)"
          Write-Host "HANDY_VC_REDIST_DIRS=$dirs"
          Add-Content -Path $env:GITHUB_ENV -Value "HANDY_VC_REDIST_DIRS=$dirs"

      # ggml-vulkan делает find_package(SPIRV-Headers CONFIG REQUIRED); из Vulkan SDK
      # в CI пакет не находится, поэтому ставим header-only пакет через vcpkg.
      - name: Install SPIRV-Headers for transcribe-cpp Vulkan build (Windows x64)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install spirv-headers:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install spirv-headers failed" }
          $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" -replace '\\','/'
          $combined = if ($env:CMAKE_PREFIX_PATH) { "$prefix;$env:CMAKE_PREFIX_PATH" } else { $prefix }
          Add-Content $env:GITHUB_ENV "CMAKE_PREFIX_PATH=$combined"
          Write-Host "CMAKE_PREFIX_PATH=$combined"

      # Секреты подписи сознательно не передаются: пустой APPLE_CERTIFICATE Tauri
      # считает сертификатом и падает. signingIdentity "-" (ad-hoc) задан в tauri.conf.json.
      - name: Build with Tauri (unsigned)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: meridian-desktop
          args: ${{ matrix.args }}

      - name: Upload artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: meridian-desktop-${{ matrix.target }}
          path: meridian-desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

      # Для x86_64-pc-windows-msvc без --target Cargo кладёт сборку в target/release.
      - name: Audit Windows package runtime contents
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundleBase = "src-tauri/target/release/bundle"

          # VC++ runtime staging обязателен для каждой Windows-сборки.
          $stagedDlls = Get-ChildItem "src-tauri/transcribe-libs" -Filter "*.dll" -ErrorAction SilentlyContinue
          if (-not $stagedDlls) {
            throw "src-tauri/transcribe-libs contains no DLLs; every Windows build must stage the app-local VC++ runtime"
          }
          foreach ($name in @("msvcp140.dll", "vcruntime140.dll", "vcomp140.dll")) {
            if (-not ($stagedDlls | Where-Object { $_.Name -ieq $name })) {
              throw "Staging is missing $name"
            }
          }
          if (-not ($stagedDlls | Where-Object { $_.Name -like "*transcribe*" })) {
            throw "Staging is missing transcribe runtime DLLs"
          }
          if (-not ($stagedDlls | Where-Object { $_.Name -like "*ggml*" })) {
            throw "Staging is missing ggml runtime DLLs"
          }

          # Оба типа установщиков должны содержать все staged DLL и запускаться.
          function Assert-PackageContents {
            param([string]$Root, [string]$Label)

            $app = Get-ChildItem $Root -Filter "meridian-desktop.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $app) {
              throw "$Label package is missing meridian-desktop.exe"
            }
            foreach ($dll in $stagedDlls) {
              if (-not (Get-ChildItem $Root -Filter $dll.Name -Recurse -ErrorAction SilentlyContinue)) {
                throw "$Label package is missing staged runtime DLL $($dll.Name)"
              }
            }

            $deviceOutput = (& $app.FullName --list-devices | Out-String)
            $deviceOutput | Write-Host
            if ($LASTEXITCODE -ne 0) {
              throw "$Label meridian-desktop.exe --list-devices failed"
            }
          }

          $nsisPackages = Get-ChildItem (Join-Path $bundleBase "nsis") -Filter "*.exe" -ErrorAction SilentlyContinue
          if (-not $nsisPackages) {
            throw "No NSIS packages found under $bundleBase for runtime DLL audit"
          }
          foreach ($pkg in $nsisPackages) {
            Write-Host "Auditing NSIS package: $($pkg.FullName)"
            $installDir = Join-Path ([System.IO.Path]::GetTempPath()) ([System.Guid]::NewGuid().ToString())
            New-Item -ItemType Directory -Path $installDir | Out-Null
            $proc = Start-Process -FilePath $pkg.FullName -ArgumentList @("/S", "/PORTABLE", "/D=$installDir") -Wait -PassThru
            if ($proc.ExitCode -ne 0) {
              throw "Silent portable install failed for $($pkg.FullName) with exit code $($proc.ExitCode)"
            }
            Assert-PackageContents -Root $installDir -Label "Installed NSIS"
            Remove-Item -Recurse -Force $installDir
          }

          # Административная установка распаковывает MSI без повышения прав.
          $msiPackages = Get-ChildItem (Join-Path $bundleBase "msi") -Filter "*.msi" -ErrorAction SilentlyContinue
          if (-not $msiPackages) {
            throw "No MSI packages found under $bundleBase for runtime DLL audit"
          }
          foreach ($pkg in $msiPackages) {
            Write-Host "Auditing MSI package: $($pkg.FullName)"
            $installDir = Join-Path ([System.IO.Path]::GetTempPath()) ([System.Guid]::NewGuid().ToString())
            New-Item -ItemType Directory -Path $installDir | Out-Null
            $logFile = Join-Path $installDir "msi-admin-install.log"
            $msiArgs = "/a `"$($pkg.FullName)`" /qn /L*v `"$logFile`" TARGETDIR=`"$installDir`""
            $proc = Start-Process -FilePath "msiexec.exe" -ArgumentList $msiArgs -Wait -PassThru
            if ($proc.ExitCode -ne 0) {
              if (Test-Path $logFile) { Get-Content $logFile | Out-Host }
              throw "Administrative install failed for $($pkg.FullName) with exit code $($proc.ExitCode)"
            }
            Assert-PackageContents -Root $installDir -Label "Installed MSI"
            Remove-Item -Recurse -Force $installDir
          }

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: meridian-desktop-${{ matrix.target }}
          path: |
            meridian-desktop/src-tauri/target/release/bundle/msi/*.msi
            meridian-desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  # Черновик релиза только на теге desktop-v*; единственное место с contents: write.
  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: meridian-desktop-*
          path: release-assets
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Артефакт Windows лежит подпапками (msi/, nsis/) — грузим только файлы.
          mapfile -t files < <(find release-assets -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \))
          printf '%s\n' "${files[@]}"
          gh release create "$TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "Meridian Desktop $TAG" \
            --notes "Неподписанные установщики: Windows x64 (.msi, .exe) и macOS Apple Silicon (.dmg)."
