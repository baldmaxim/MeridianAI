name: build-images

# Сборка образов в CI и публикация в GHCR (§19: build вне prod, immutable tags).
# vds затем делает docker pull + up — без сборки.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'meridian-web/backend/**'
      - 'meridian-web/frontend/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  packages: write

jobs:
  # Проверки перед сборкой образов: упали тесты/линт/сборка — образы не публикуются.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- backend (Python — как в meridian-web/backend/Dockerfile) ---
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: meridian-web/backend/requirements.txt

      - name: Backend install
        working-directory: meridian-web/backend
        run: |
          pip install -r requirements.txt
          pip install ruff==0.17.1

      - name: Backend ruff
        working-directory: meridian-web/backend
        run: ruff check .

      - name: Backend pytest
        working-directory: meridian-web/backend
        env:
          TEST_DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: pytest -q

      # --- frontend (Node — как в meridian-web/frontend/Dockerfile) ---
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: meridian-web/frontend/package-lock.json

      - name: Frontend install
        working-directory: meridian-web/frontend
        run: npm ci

      - name: Frontend lint
        working-directory: meridian-web/frontend
        run: npm run lint

      - name: Frontend build (tsc + vite)
        working-directory: meridian-web/frontend
        run: npm run build

      - name: Frontend tests
        working-directory: meridian-web/frontend
        run: npm run test --if-present

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # buildx + gha-кэш: apt/pip/npm-слои переиспользуются между сборками, у новых тегов
      # общие слои с прошлыми — деплой тянет на Selectel мегабайты, а не ~0.8 ГБ
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push api
        uses: docker/build-push-action@v6
        with:
          context: meridian-web/backend
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/meridian-api:latest
            ghcr.io/${{ steps.owner.outputs.name }}/meridian-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: meridian-web/frontend
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/meridian-frontend:latest
            ghcr.io/${{ steps.owner.outputs.name }}/meridian-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
