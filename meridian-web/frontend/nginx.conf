server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Сжатие. gzip_http_version 1.0 обязателен: ingress ходит сюда по HTTP/1.0 (proxy_pass
    # без proxy_http_version 1.1), иначе по умолчанию (1.1) ответы не сжимались бы.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_http_version 1.0;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/html
        application/javascript
        text/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # HTML-входная точка, манифесты, service worker и init-скрипт темы (без хэша в имени)
    # всегда ревалидируются, чтобы редеплой подхватывался сразу.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }
    location = /theme-init.js {
        add_header Cache-Control "no-cache";
    }
    # service worker (vite-plugin-pwa): sw.js, registerSW.js, workbox-*.js — не кэшировать надолго,
    # иначе браузер не увидит новую версию SW.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }
    location ~ ^/workbox-[^/]+\.js$ {
        add_header Cache-Control "no-cache";
    }

    # Контент-хэшированные ассеты иммутабельны — кэшируем надолго.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
