# Маршрутизация app.example.com → контейнеры портала по сети infra_web.
# Docker-resolver + переменные в proxy_pass → nginx ПЕРЕРАЗРЕШАЕТ api/frontend по DNS
# (TTL 10s). Поэтому пересоздание контейнеров портала (новый IP при deploy) НЕ роняет
# ingress и НЕ требует reload. Алиасы = сетевые имена из deploy/portal/docker-compose.yml.

# встроенный DNS Docker (резолвит алиасы контейнеров на сети infra_web)
resolver 127.0.0.11 valid=10s ipv6=off;

# Лог для /s3/: БЕЗ query-строки ($uri, не $request_uri/$args) — там presigned-подпись (§18).
# Нужен, чтобы сбои загрузки (413/504) вообще были видны: раньше стоял access_log off и
# 413 от вышестоящего прокси не находился ни в одном логе.
log_format s3proxy '$remote_addr $request_method $uri $status '
                   'req=$request_length resp=$body_bytes_sent t=$request_time';

# HTTP: ACME challenge + redirect → HTTPS (§23)
server {
    listen 80;
    server_name app.example.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# HTTPS
server {
    listen 443 ssl;
    listen 8443 quic;
    server_name app.example.com;
    add_header Alt-Svc 'h3=":8443"; ma=86400' always;  # 05.10.2026 HTTP/3: на LTE TCP режут после ~19 КБ

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security headers на уровне ingress (§23). App добавляет остальные.
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), display-capture=(self), camera=(), geolocation=(), payment=(), usb=()" always;
    # CSP: script-src blob: — AudioWorklet грузится из Blob URL (useAudioRecorder, useSecondaryShadow);
    # style-src 'unsafe-inline' — inline <style>/style={} в компонентах; шрифты — Google Fonts;
    # connect-src wss: — WebSocket на тот же хост; S3 идёт через same-origin /s3/.
    # Скрипты темы — внешним файлом /theme-init.js (без inline).
    # ВНИМАНИЕ: location с собственным add_header сбрасывает server-level заголовки — в таких
    # locations (сейчас их нет) нужно повторять весь набор.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' wss:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Автообновление десктоп-приложения: манифест лежит в GitHub Releases (/desktop — иначе SPA-маршрут)
    location = /desktop/latest.json {
        return 302 https://github.com/baldmaxim/MeridianAI/releases/latest/download/latest.json;
    }

    # Frontend (SPA)
    location / {
        set $up_front meridian-frontend:80;
        proxy_pass http://$up_front$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # REST API
    location /api/ {
        limit_req zone=meridian_api burst=40 nodelay;
        set $up_api meridian-api:8000;
        proxy_pass http://$up_api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25M;   # обычные запросы; крупные файлы — presigned S3
        proxy_read_timeout 120s;
        # сжатие JSON ответов API (только здесь; /api/auth/, /ws/, /s3/ не сжимаем — BREACH/стримы)
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_types application/json;
    }

    # Жёсткий лимит на auth (anti-bruteforce, §21)
    location /api/auth/ {
        limit_req zone=meridian_auth burst=5 nodelay;
        set $up_auth meridian-api:8000;
        proxy_pass http://$up_auth$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health (для uptime-проверок, §20)
    location = /health/live  { set $up_hl meridian-api:8000; proxy_pass http://$up_hl$request_uri; proxy_set_header Host $host; }
    location = /health/ready { set $up_hr meridian-api:8000; proxy_pass http://$up_hr$request_uri; proxy_set_header Host $host; }

    # Хранилище через свой домен: у части клиентов s3.cloud.ru недоступен напрямую.
    # Подпись SigV4 считается по хосту S3 → обязателен proxy_set_header Host <хост S3>.
    # Ссылки presigned, поэтому доступ ограничен подписью, а не нашей авторизацией.
    location /s3/ {
        # proxy_pass с URI («/») меняет только префикс и сохраняет исходное
        # процентное кодирование пути — иначе подпись SigV4 разъедется.
        proxy_pass https://s3.cloud.ru/;
        proxy_set_header Host s3.cloud.ru;
        proxy_ssl_server_name on;
        proxy_set_header Authorization "";   # наш JWT в хранилище не отправляем
        proxy_set_header Cookie "";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass_request_headers on;

        access_log /var/log/nginx/access.log s3proxy;   # без query — подпись не утекает (§18)
        client_max_body_size 1024M;          # PUT крупных аудио идёт через прокси
        # ВНИМАНИЕ: лимит должен быть поднят на КАЖДОМ прокси перед этим — домен может
        # смотреть на внешний реверс-прокси (см. deploy/README-ingress-chain.md).
        proxy_request_buffering off;         # стримим загрузку, не копим на диске
        proxy_buffering off;                 # стримим отдачу и Range для плеера
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # WebSocket
    location /ws/ {
        set $up_ws meridian-api:8000;
        proxy_pass http://$up_ws$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
